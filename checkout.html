<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Checkout — GRAINA</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;
            padding: 0;
            background: #f5efe3;
            color: #3b2418;
            font-family: "DM Sans", sans-serif;
        }


        /* ===============================
           MAIN CONTAINER
        =============================== */

        .checkout-wrapper {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 55px 35px 80px;
        }


        /* ===============================
           TOP BAR
        =============================== */

        .checkout-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 55px;
        }


        .checkout-title {
            margin: 0;

            font-family:
                "Playfair Display",
                serif;

            font-size: 58px;
            line-height: 1;

            font-weight: 600;

            color: #3b2418;
        }


        .continue-shopping {
            color: #3b2418;

            text-decoration: none;

            font-size: 13px;

            letter-spacing: .5px;

            white-space: nowrap;

            border-bottom:
                1px solid #3b2418;

            padding-bottom: 4px;

            transition:
                opacity .3s ease;
        }


        .continue-shopping:hover {
            opacity: .55;
        }


        /* ===============================
           CHECKOUT GRID
        =============================== */

        .checkout-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 1.15fr)
                minmax(320px, .85fr);

            gap: 60px;

            align-items: start;
        }


        /* ===============================
           LEFT SIDE
        =============================== */

        .customer-section {
            min-width: 0;
        }


        .section-heading {

            margin:
                0 0 25px;

            font-family:
                "Playfair Display",
                serif;

            font-size: 34px;

            font-weight: 600;

            color: #3b2418;
        }


        /* ===============================
           FORM
        =============================== */

        .checkout-form {
            width: 100%;
        }


        .form-group {
            margin-bottom: 14px;
        }


        .form-input,
        .form-textarea {

            width: 100%;

            display: block;

            border:
                1px solid #d8cdbc;

            background:
                rgba(250,247,240,.95);

            color: #3b2418;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 14px;

            outline: none;

            border-radius: 0;

            transition:
                border-color .25s ease,
                box-shadow .25s ease;
        }


        .form-input {

            height: 56px;

            padding:
                0 17px;
        }


        .form-textarea {

            min-height: 130px;

            padding: 17px;

            resize: vertical;
        }


        .form-input::placeholder,
        .form-textarea::placeholder {

            color: #8c8073;
        }


        .form-input:focus,
        .form-textarea:focus {

            border-color: #a77b3d;

            box-shadow:
                0 0 0 3px
                rgba(167,123,61,.08);
        }


        /* ===============================
           PLACE ORDER
        =============================== */

        .place-order-btn {

            width: 100%;

            min-height: 58px;

            margin-top: 12px;

            border: 0;

            border-radius: 0;

            background: #3b2418;

            color: #fff;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            cursor: pointer;

            transition:
                background .3s ease,
                transform .3s ease;
        }


        .place-order-btn:hover {

            background: #57321f;

            transform:
                translateY(-2px);
        }


        /* ===============================
           ORDER SUMMARY
        =============================== */

        .order-summary {

            width: 100%;

            background:
                #faf7f0;

            border:
                1px solid #ded4c5;

            padding: 32px;

            position: sticky;

            top: 25px;
        }


        .summary-title {

            margin:
                0 0 25px;

            font-family:
                "Playfair Display",
                serif;

            font-size: 30px;

            font-weight: 600;
        }


        #checkoutItems {
            width: 100%;
        }


        .checkout-item {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            padding:
                17px 0;

            border-bottom:
                1px solid #e5ddd0;
        }


        .checkout-item-info {

            min-width: 0;
        }


        .checkout-item-name {

            display: block;

            font-family:
                "Playfair Display",
                serif;

            font-size: 17px;

            line-height: 1.3;

            color: #3b2418;
        }


        .checkout-item-meta {

            display: block;

            margin-top: 6px;

            font-size: 12px;

            color: #756b60;
        }


        .checkout-item-price {

            flex-shrink: 0;

            font-weight: 600;

            font-size: 14px;

            color: #3b2418;
        }


        /* ===============================
           TOTAL
        =============================== */

        .total-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 25px;

            padding-top: 22px;

            border-top:
                1px solid #d8cdbc;
        }


        .total-label {

            font-size: 14px;

            color: #756b60;
        }


        .total-price {

            font-size: 22px;

            color: #3b2418;
        }


        /* ===============================
           EMPTY CART
        =============================== */

        .empty-checkout {

            padding: 25px 0;

            text-align: center;

            color: #756b60;

            font-size: 14px;
        }


        /* ===============================
           SMALL NOTE
        =============================== */

        .secure-note {

            margin-top: 18px;

            text-align: center;

            font-size: 11px;

            letter-spacing: .4px;

            color: #8c8073;
        }


        /* ===============================
           TABLET
        =============================== */

        @media (max-width: 900px) {

            .checkout-wrapper {

                padding:
                    45px 25px 70px;
            }


            .checkout-grid {

                grid-template-columns: 1fr;

                gap: 40px;
            }


            .order-summary {

                position: relative;

                top: auto;
            }


            .checkout-title {

                font-size: 50px;
            }

        }


        /* ===============================
           MOBILE
        =============================== */

        @media (max-width: 600px) {

            .checkout-wrapper {

                padding:
                    30px 16px 50px;
            }


            .checkout-top {

                align-items: flex-start;

                margin-bottom: 35px;

                gap: 15px;
            }


            .checkout-title {

                font-size: 42px;

                line-height: 1.05;
            }


            .continue-shopping {

                font-size: 11px;

                margin-top: 8px;
            }


            .checkout-grid {

                display: flex;

                flex-direction: column;

                gap: 30px;
            }


            .section-heading {

                font-size: 28px;

                margin-bottom: 20px;
            }


            .form-input {

                height: 54px;

                padding:
                    0 14px;

                font-size: 14px;
            }


            .form-textarea {

                min-height: 120px;

                padding: 14px;

                font-size: 14px;
            }


            .place-order-btn {

                min-height: 56px;

                margin-top: 8px;
            }


            .order-summary {

                padding: 23px 18px;

                position: relative;

                top: auto;
            }


            .summary-title {

                font-size: 27px;

                margin-bottom: 18px;
            }


            .checkout-item {

                gap: 12px;

                padding: 15px 0;
            }


            .checkout-item-name {

                font-size: 16px;
            }


            .checkout-item-price {

                font-size: 13px;
            }


            .total-row {

                margin-top: 18px;

                padding-top: 18px;
            }


            .total-price {

                font-size: 20px;
            }

        }


        /* ===============================
           SMALL MOBILE
        =============================== */

        @media (max-width: 380px) {

            .checkout-wrapper {

                padding:
                    25px 13px 45px;
            }


            .checkout-title {

                font-size: 36px;
            }


            .continue-shopping {

                font-size: 10px;
            }


            .section-heading {

                font-size: 25px;
            }


            .order-summary {

                padding: 20px 15px;
            }

        }

    </style>

</head>


<body>


<div class="checkout-wrapper">


    <!-- ===============================
         TOP
    ================================ -->

    <div class="checkout-top">

        <h1 class="checkout-title">
            Checkout
        </h1>


        <a
            href="index.html#shop"
            class="continue-shopping">

            Continue Shopping

        </a>

    </div>



    <!-- ===============================
         MAIN
    ================================ -->

    <div class="checkout-grid">


        <!-- ===============================
             CUSTOMER DETAILS
        ================================ -->

        <section class="customer-section">

            <h2 class="section-heading">
                Your Details
            </h2>


            <form
                id="checkoutForm"
                class="checkout-form">


                <div class="form-group">

                    <input
                        id="name"
                        class="form-input"
                        type="text"
                        placeholder="Full Name"
                        autocomplete="name"
                        required>

                </div>


                <div class="form-group">

                    <input
                        id="email"
                        class="form-input"
                        type="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required>

                </div>


                <div class="form-group">

                    <input
                        id="phone"
                        class="form-input"
                        type="tel"
                        placeholder="Phone Number"
                        autocomplete="tel"
                        inputmode="tel"
                        required>

                </div>


                <div class="form-group">

                    <textarea
                        id="address"
                        class="form-textarea"
                        placeholder="Delivery Address"
                        autocomplete="street-address"
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="place-order-btn">

                    PLACE ORDER →

                </button>


            </form>


            <div class="secure-note">

                Your details are used only to process your order.

            </div>

        </section>



        <!-- ===============================
             ORDER SUMMARY
        ================================ -->

        <aside class="order-summary">

            <h2 class="summary-title">
                Your Order
            </h2>


            <div id="checkoutItems"></div>


            <div class="total-row">

                <span class="total-label">
                    Total
                </span>


                <strong
                    id="checkoutTotal"
                    class="total-price">

                    ₹0

                </strong>

            </div>

        </aside>


    </div>

</div>



<script>

/* ==========================================
   GET CART
========================================== */

const cart =
    JSON.parse(
        localStorage.getItem("grainaCart")
    ) || [];


/* ==========================================
   ELEMENTS
========================================== */

const items =
    document.getElementById(
        "checkoutItems"
    );


const totalElement =
    document.getElementById(
        "checkoutTotal"
    );


let total = 0;


/* ==========================================
   DISPLAY CART
========================================== */

if (cart.length === 0) {

    items.innerHTML = `

        <div class="empty-checkout">

            Your basket is empty.

            <br><br>

            <a
                href="index.html#shop"
                style="
                    color:#3b2418;
                    text-decoration:underline;
                ">

                Continue Shopping

            </a>

        </div>

    `;

} else {


    cart.forEach(item => {

        const itemTotal =
            Number(item.price) *
            Number(item.quantity);


        total += itemTotal;


        items.innerHTML += `

            <div class="checkout-item">

                <div class="checkout-item-info">

                    <strong
                        class="checkout-item-name">

                        ${item.name}

                    </strong>


                    <span
                        class="checkout-item-meta">

                        ₹${Number(item.price)
                            .toLocaleString("en-IN")}
                        × ${item.quantity}

                    </span>

                </div>


                <strong
                    class="checkout-item-price">

                    ₹${itemTotal
                        .toLocaleString("en-IN")}

                </strong>

            </div>

        `;

    });

}


/* ==========================================
   TOTAL
========================================== */

totalElement.textContent =
    "₹" +
    total.toLocaleString("en-IN");


/* ==========================================
   CHECKOUT FORM
========================================== */

document
    .getElementById("checkoutForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            /* Empty cart */

            if (cart.length === 0) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            /* Customer */

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const address =
                document
                    .getElementById("address")
                    .value
                    .trim();


            /* Validation */

            if (
                !name ||
                !email ||
                !phone ||
                !address
            ) {

                alert(
                    "Please fill all details."
                );

                return;

            }


            /* Create order */

            const order = {

                customer: {

                    name: name,

                    email: email,

                    phone: phone,

                    address: address

                },

                items: cart,

                total: total,

                createdAt:
                    new Date()
                    .toISOString()

            };


            /* Save order */

            localStorage.setItem(
                "grainaOrder",
                JSON.stringify(order)
            );


            /* Go success page */

            window.location.href =
                "order-success.html";

        }
    );

</script>


</body>

</html>
